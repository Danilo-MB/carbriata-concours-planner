<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <defs>
    <!-- Map fold gradients -->
    <linearGradient id="full-mf-fold-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="full-mf-fold-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="full-mf-fold-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Zoned Areas Gradients -->
    <linearGradient id="full-mf-area-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="full-mf-area-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="full-mf-area-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Pin Gradient -->
    <linearGradient id="full-mf-pin-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="full-mf-pin-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Typography Gradient -->
    <linearGradient id="full-flex-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark on the left (scaled down to 38x38 inside 48 height) -->
  <g transform="translate(4, 5) scale(0.8)">
    <path d="M6 16.5L18 11.5V37.5L6 42.5V16.5Z" fill="url(#full-mf-fold-left)" stroke="#475569" stroke-width="0.75" />
    <path d="M18 11.5L30 17.5V43.5L18 37.5V11.5Z" fill="url(#full-mf-fold-mid)" stroke="#475569" stroke-width="0.75" />
    <path d="M30 17.5L42 12.5V38.5L30 43.5V17.5Z" fill="url(#full-mf-fold-right)" stroke="#475569" stroke-width="0.75" />

    <path d="M18 11.5V37.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" />
    <path d="M30 17.5V43.5" stroke="#000000" stroke-opacity="0.4" stroke-width="1" />

    <!-- Areas -->
    <path d="M8 22L16 18.5V30.5L8 34V22Z" fill="url(#full-mf-area-emerald)" fill-opacity="0.85" stroke="#34D399" stroke-width="0.8" />
    <path d="M32 23.5L40 20V31.5L32 35V23.5Z" fill="url(#full-mf-area-amber)" fill-opacity="0.85" stroke="#FBBF24" stroke-width="0.8" />
    <path d="M20 20L28 24V35L20 31V20Z" fill="url(#full-mf-area-indigo)" fill-opacity="0.9" stroke="#818CF8" stroke-width="0.9" />

    <!-- Pin -->
    <g filter="url(#full-mf-pin-shadow)">
      <path d="M24.5 5.5 C 21.46 5.5 19 7.96 19 11 C 19 15.3 23.8 21.6 24.15 22.1 C 24.32 22.3 24.68 22.3 24.85 22.1 C 25.2 21.6 30 15.3 30 11 C 30 7.96 27.54 5.5 24.5 5.5 Z" fill="url(#full-mf-pin-gradient)" stroke="#FFFFFF" stroke-width="0.75" />
      <circle cx="24.5" cy="11" r="2.4" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: MapFlex (WITHOUT .APP) -->
  <g transform="translate(48, 31)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.03em" fill="#0F172A">
      Map<tspan fill="url(#full-flex-grad)">Flex</tspan>
    </text>
  </g>
</svg>